// BERX ARENA — server.cfg (install-cs2.ps1 автоматаар бөглөнө)
hostname "__HOSTNAME__"
rcon_password "__RCON__"
sv_password "__PASSWORD__"

sv_lan 0
sv_cheats 0
sv_hibernate_when_empty 0
sv_visiblemaxplayers 12

// Competitive 5v5 үндсэн тохиргоо
