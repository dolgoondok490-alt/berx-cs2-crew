mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_freezetime 15
mp_startmoney 800
mp_friendlyfire 1
mp_warmuptime 9999
mp_warmup_pausetimer 1
bot_quota 0
bot_quota_mode normal

log on
