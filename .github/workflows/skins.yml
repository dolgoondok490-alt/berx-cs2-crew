name: BERX SKIN INVENTORY
on:
  push:
    branches: ['skins-inventory']
    paths: ['lib/**', 'agent/**', 'tests/skins/**', 'skins/**', 'assets/data/**', 'js/**', 'server/**', '.github/workflows/skins.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
          - db: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -proot
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install agent optional dependency (mysql2)
        working-directory: agent
        run: npm install --no-audit --no-fund
      - name: Agent sync unit tests (fake driver)
        run: node tests/skins/unit.mjs
      - name: End-to-end (site + agent + ${{ matrix.db }})
        env: { MYSQL_HOST: 127.0.0.1, MYSQL_PORT: 3306, MYSQL_ROOT_PASSWORD: root }
        run: node tests/skins/e2e.mjs
