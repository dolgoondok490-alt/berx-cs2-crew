name: BERX ARENA server + Workshop/AIM
on:
  push:
    branches: ['ranked-aim-guard-fix', 'berx-ranking-v1', 'workshop-aim', 'main', 'stats-fix', 'workshop-map-replace', 'skin-team-filter-admin-settings', 'berx-match-history-v1']
    paths: ['lib/**', 'agent/**', 'server/**', 'js/**', 'css/**', 'tests/server/**', 'tests/skins/fake-supabase.js', 'tests/stats/**', '.github/workflows/arena.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check
        run: for f in agent/rcon.js agent/guard.js agent/berx-agent.js agent/arena-modes.js agent/skins-sync.js agent/match-recorder.js agent/match-history.js lib/*.js js/pages/*.js js/services/*.js js/app.js tests/server/fake-cs2.js; do node --check "$f" || exit 1; done
      - name: PowerShell syntax (agent/windows/*.ps1)
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem agent/windows/*.ps1) {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e.Count) { $e | ForEach-Object { Write-Error "$($f.Name): $($_.Message) @ $($_.Extent.StartLineNumber)" }; exit 1 }
            Write-Host "ok $($f.Name)"
          }
      - name: Catalog JSON valid
        run: node -e "const a=require('./agent/arena-modes'); const c=a.loadCatalog(); console.log(c.map(m=>m.id+'='+m.workshopId).join(', '))"
      - name: RCON client + BERX Guard unit (fragmented packets, empty/timeout/reconnect, parser, lock)
        run: node tests/server/rcon-guard-unit.mjs
      - name: BERX Guard end-to-end (real agent + site + fake CS2 with RCON faults)
        run: node tests/server/guard-e2e.mjs
      - name: Workshop/AIM unit tests
        run: node tests/server/arena-unit.mjs
      - name: SERVER API regression + Workshop/AIM end-to-end (site + agent + fake CS2)
        run: node tests/server/arena.mjs
      - name: Skin Inventory unit tests (agent v1.3.0)
        run: node tests/skins/unit.mjs
      - name: Settings → Server admin-only (health, /api/admin/system 401/403, admin actions 403)
        run: node tests/server/admin-settings.mjs
      - name: Statistics sync guard (key-less Preview must not overwrite stored stats)
        run: node tests/stats/sync-guard.mjs
