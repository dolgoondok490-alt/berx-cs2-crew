name: BERX GUARD PLUGIN
# CounterStrikeSharp 1.0.380 (серверийнхтэй ижил) API-аар build. Серверт АВТОМАТААР СУУЛГАХГҮЙ —
# artifact (BerxGuard.dll + SHA256) татаж, admin зөвшөөрлөөр гараар суулгана (docs/RANKING.md).
on:
  push:
    branches: ['berx-ranking-v1', 'main']
    paths: ['plugins/BerxGuard/**', '.github/workflows/berx-guard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build (Release)
        run: dotnet build plugins/BerxGuard/BerxGuard.csproj -c Release -o out/BerxGuard
      - name: Package + SHA256
        run: |
          ls -la out/BerxGuard
          test -f out/BerxGuard/BerxGuard.dll
          # Зөвхөн плагины өөрийн файл (CounterStrikeSharp.API.dll серверт аль хэдийн бий)
          mkdir -p dist/BerxGuard && cp out/BerxGuard/BerxGuard.dll dist/BerxGuard/
          (cd dist && sha256sum BerxGuard/BerxGuard.dll | tee BerxGuard.sha256)
      - uses: actions/upload-artifact@v4
        with: { name: BerxGuard-1.0.0, path: dist, retention-days: 30 }
